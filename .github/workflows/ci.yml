name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      # Debug: sanitizers on, headless build. Release: sanitizers off, GUI stub on.
      SANITIZERS: ${{ matrix.config == 'Debug' && 'ON' || 'OFF' }}
      BUILD_GUI: ${{ matrix.config == 'Debug' && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg development packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libavformat-dev libavcodec-dev libswscale-dev libavutil-dev pkg-config
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_ENABLE_SANITIZERS=$SANITIZERS
          -DVGLYPH_BUILD_GUI=$BUILD_GUI
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # FFmpeg comes from the runner's vcpkg through the `media` manifest
      # feature; built packages are cached, so only the first run after a change
      # to vcpkg.json or to the runner image is slow.
      - name: Prepare vcpkg binary cache
        id: vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      # The runner image brings its own vcpkg ports, so a new image can need new
      # packages. A cache is never saved again under a key that already hit, so
      # the image is part of the key; restore-keys brings back what still matches.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg.outputs.image }}
          restore-keys: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_BUILD_GUI=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_FEATURES=media
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # The interactive player needs a real console, which a runner does not
      # have. This covers what it can: a UTF-8 file name through argv, info and
      # convert on that file, and play refusing to start without a console.
      - name: CLI smoke test
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $name = "g" + [char]0x00FC + [char]0x015F + [char]0x011F + ".png"
          $png = Join-Path $env:RUNNER_TEMP $name
          $bmp = New-Object System.Drawing.Bitmap 16, 16
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.Clear([System.Drawing.Color]::White)
          $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()

          $exe = Join-Path $PWD "build/vglyph.exe"
          $failed = $false
          function Check($ok, $what) {
            if ($ok) { Write-Host "ok: $what" } else { Write-Host "FAILED: $what"; $script:failed = $true }
          }

          $info = (& $exe info $png) -join "`n"
          Check ($LASTEXITCODE -eq 0 -and $info -match "width: 16") "info on a UTF-8 file name"

          $out = Join-Path $env:RUNNER_TEMP ("o" + [char]0x00E7 + ".txt")
          & $exe convert $png -o $out -w 8 --format txt
          Check ($LASTEXITCODE -eq 0 -and (Test-Path $out) -and (Get-Item $out).Length -gt 8) "convert to a UTF-8 file name"

          & $exe convert $png -o - -w 8 | Out-Null
          Check ($LASTEXITCODE -eq 0) "convert to stdout"

          & $exe play $png 2>$null
          Check ($LASTEXITCODE -eq 2) "play without a console exits 2 (got $LASTEXITCODE)"

          # The shell would otherwise exit with the last native exit code (play's 2).
          if ($failed) { exit 1 } else { exit 0 }
