name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      # Debug: sanitizers on, headless build. Release: sanitizers off, GUI stub on.
      SANITIZERS: ${{ matrix.config == 'Debug' && 'ON' || 'OFF' }}
      BUILD_GUI: ${{ matrix.config == 'Debug' && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_ENABLE_SANITIZERS=$SANITIZERS
          -DVGLYPH_BUILD_GUI=$BUILD_GUI
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # No vcpkg yet: FFmpeg is an optional `media` feature enabled in phase 2.
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_BUILD_GUI=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
