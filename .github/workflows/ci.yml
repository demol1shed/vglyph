name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      # Debug: sanitizers on, headless build. Release: sanitizers off, GUI stub on.
      SANITIZERS: ${{ matrix.config == 'Debug' && 'ON' || 'OFF' }}
      BUILD_GUI: ${{ matrix.config == 'Debug' && 'OFF' || 'ON' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg development packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libavformat-dev libavcodec-dev libswscale-dev libavutil-dev pkg-config
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_ENABLE_SANITIZERS=$SANITIZERS
          -DVGLYPH_BUILD_GUI=$BUILD_GUI
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # FFmpeg comes from the runner's vcpkg through the `media` manifest
      # feature; built packages are cached so only the first run is slow.
      - name: Prepare vcpkg binary cache
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVGLYPH_BUILD_GUI=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_FEATURES=media
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
